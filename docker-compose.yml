services:
  # Base de Datos MySQL (conforme a arquitectura de la propuesta técnica)
  database:
    image: mysql:8.0
    container_name: dominio_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dominio_estudio
      MYSQL_USER: dominio_user
      MYSQL_PASSWORD: dominiopassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend REST API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dominio_backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_CLIENT: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: dominio_estudio
    ports:
      - "4000:4000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  # Frontend Web UI (React + Vite + Tailwind + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dominio_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
